[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpis-search"
version = "0.1.0"
description = "Anonymous encrypted index and vector retrieval"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.10,<4", "cryptography>=43", "msgpack>=1.0,<2", "numpy>=1.26,<3", "PyNaCl>=1.5,<2", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
bench = ["h5py>=3.10,<4"]

[project.scripts]
hpis = "hpis.__main__:main"
hpis-demo = "showcase.server:main"

[tool.setuptools]
packages = ["hpis", "showcase", "integration", "integration.mapped_index", "integration.mapped_index.q8"]

[tool.setuptools.package-data]
showcase = ["static/*", "static/assets/*", "static/data/*", "static/data/records/*", "static/media/*"]

"integration.mapped_index" = ["*.c", "*.h"]

"integration.mapped_index.q8" = ["*.cc", "*.h", "README.md"]
